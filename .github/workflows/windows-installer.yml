name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install NSIS
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH
      - name: Build and check installer
        run: ./build/windows/ci-installer.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: sessionsplit-windows-amd64-${{ github.run_number }}
          path: |
            bin/sessionsplit-amd64-installer.exe
            bin/windows-build.json
            bin/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Explain artifact scope
        run: |
          @'
          Download the sessionsplit-windows-amd64 artifact and run sessionsplit-amd64-installer.exe.
          This unsigned test installer uses installed Chrome/Chromium or Brave.
          It does not yet bundle the unfinished custom fingerprint engine.
          '@ >> $env:GITHUB_STEP_SUMMARY
