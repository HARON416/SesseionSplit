name: Windows Chromium baseline

on:
  workflow_dispatch:
    inputs:
      start_stage:
        description: Resume only after earlier stages passed on this same persistent runner
        type: choice
        default: prepare
        options: [prepare, sync, hooks, configure, build, verify, package-windows]
      jobs:
        description: Parallel compiler jobs (use 4 for a 32 GB runner)
        type: choice
        default: '4'
        options: ['2', '4', '8']

permissions:
  contents: read

concurrency:
  group: windows-chromium-baseline
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Require the configured Windows Chromium runner
        env:
          RUNNER_NAME: ${{ vars.WINDOWS_CHROMIUM_RUNNER }}
        run: |
          if [ -z "$RUNNER_NAME" ]; then
            echo '::error::Set WINDOWS_CHROMIUM_RUNNER to a provisioned larger Windows runner name or a self-hosted Windows runner label. See WINDOWS_BUILDS.md.'
            exit 1
          fi
  baseline:
    needs: configuration
    runs-on: ${{ vars.WINDOWS_CHROMIUM_RUNNER || 'sessionsplit-windows-chromium' }}
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      DEPOT_TOOLS_UPDATE: '0'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          # Retain the multi-gigabyte workspace on persistent self-hosted runners.
          clean: false
          persist-credentials: false
      - name: Build and verify pinned Chromium
        env:
          START_STAGE: ${{ inputs.start_stage }}
          BUILD_JOBS: ${{ inputs.jobs }}
        run: ./browser-engine/windows-ci.ps1 -StartStage $env:START_STAGE -Jobs ([int]$env:BUILD_JOBS)
      - name: Upload verified baseline installer
        uses: actions/upload-artifact@v6
        with:
          name: chromium-windows-baseline-${{ github.run_number }}
          path: |
            .tools/chromium/workspace/src/out/SessionSplitBaseline/mini_installer.exe
            .tools/chromium/baseline-verification.json
            .tools/chromium/windows-package.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chromium-windows-logs-${{ github.run_number }}
          path: |
            .tools/chromium/logs/*.log
            .tools/chromium/state.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
